<!DOCTYPE html>
<html>
<head>
    <title>To-Do Form</title>
</head>
<body>
    <h1>To-Do Form</h1>
    <form action="/submittodoitem" method="POST">
        <label for="itemName">Item Name:</label><br>
        <input type="text" id="itemName" name="itemName" required><br><br>

        <label for="itemDescription">Item Description:</label><br>
        <textarea id="itemDescription" name="itemDescription" required></textarea><br><br>
       
        <label for="itemId">Item ID:</label>
        <input type="text" id="itemId" name="itemId">

        <label for="itemUUID">Item UUID:</label>
        <input type="text" id="itemUUID" name="itemUUID">

        <label for="itemHash">Item Hash:</label>
        <input type="text" id="itemHash" name="itemHash">



        <button type="submit">Submit</button>
    </form>
</body>
</html>
